<div class="testimonial-container">
  <div class="testimonial-title">What Our Customers Say</div>
<div class="testimonial-row">
  <div *ngFor="let testimonial of testimonials" class="testimonial-card">
    <img [src]="testimonial.image" alt="{{ testimonial.user }}" class="profile-pic">
    <p class="testimonial-text">"{{ testimonial.text }}"</p>
    <a class="user-name" href="{{ testimonial.user }}"> {{ testimonial.user }} </a>
  </div>
  </div>
</div>
