<div class="container">
  <div class="sign-in-card">
    <form (ngSubmit)="onSubmit()" #signInForm="ngForm">
      
      <!-- Email Field -->
      <div class="input-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="Enter your email" 
          #emailInput="ngModel"
        >
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Please enter a valid email.
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Enter your password" 
          #passwordInput="ngModel"
        >
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
          Password is required.
        </div>
      </div>

      <!-- Submit Button -->
      <div class="submit-btn">
        <button type="submit" [disabled]="signInForm.invalid">Sign In</button>
      </div>

      <!-- Sign Up Link -->
      <div class="link">
        <p>Don't have an account? <a routerLink="/sign-up" class="sign-up-link">Sign Up</a></p>
      </div>
    </form>
  </div>
</div>
