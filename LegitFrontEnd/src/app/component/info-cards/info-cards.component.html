<div class="info-cards-container">
  <!-- Card Display -->
  <div class="info-card-wrapper">
    <div *ngFor="let card of cards; let i = index" class="info-card" 
         [class.active]="i === currentIndex"
         [class.prev]="i === currentIndex - 1">
      <div class="info-card-img" [style.backgroundImage]="'url(' + card.image + ')'"></div>
      <div class="info-card-content">
        <p class="info-card-text">{{ card.text }}</p>
      </div>
    </div>
  </div>
</div>
