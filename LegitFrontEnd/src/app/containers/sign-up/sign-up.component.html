<div class="container">
  <div class="signup-card">
    <form (ngSubmit)="onSubmit()" #signUpForm="ngForm">
      
      <!-- Name Field -->
      <div class="input-group">
        <label for="name">Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="name" 
          required 
          placeholder="Enter your name" 
          #nameInput="ngModel"
        >
        <div *ngIf="nameInput.invalid && nameInput.touched" class="error-message">
          Name is required.
        </div>
      </div>

      <!-- Email Field -->
      <div class="input-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="Enter your email" 
          #emailInput="ngModel"
        >
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Please enter a valid email.
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Enter your password" 
          #passwordInput="ngModel"
        >
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
          Password is required.
        </div>
      </div>

      <!-- Submit Button -->
      <div class="submit-btn">
        <button type="submit" [disabled]="signUpForm.invalid">Submit</button>
      </div>

      <!-- Login Link -->
      <div class="link">
        <p>Already have an account? <a routerLink="/sign-in">Sign In</a></p>
      </div>
    </form>
  </div>
</div>
